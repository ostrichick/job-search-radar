name: Refresh jobs and deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/jobs.json
      - profiles/dubu/public/jobs.json
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORK24_AUTH_KEY: ${{ secrets.WORK24_AUTH_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Scheduled refreshes change the feed, not the UI code. Keep unit/data
      # checks above on every run; browser regressions run on pushes/manual runs.
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'schedule'
      - run: npm run test:e2e
        if: github.event_name != 'schedule'
      # The main collection records Remotive/Jobicy/Remote OK/Arbeitnow
      # responses; the Dubu collection reuses them, so each API is queried
      # once per refresh (four times a day).
      - run: npm run build:static
        env:
          SHARED_RESPONSE_DIR: ${{ runner.temp }}/shared-responses
      - run: node scripts/validate-feed.mjs public/jobs.json docs/jobs.json
      # Dubu profile. Its collector keeps the last good feed and exits non-zero
      # when every source failed; that must not block the main deployment.
      - name: Refresh Dubu feed
        env:
          SHARED_RESPONSE_DIR: ${{ runner.temp }}/shared-responses
        run: node profiles/dubu/scripts/collect.mjs || echo "::warning::Dubu collection wrote no new feed; publishing the last good Dubu feed"
      - name: Publish Dubu feed
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs';const f=JSON.parse(readFileSync('profiles/dubu/public/jobs.json','utf8'));if(!Array.isArray(f.jobs)||!Array.isArray(f.sourceStatus)||!f.updatedAt)process.exit(1)"
          mkdir -p public/feeds
          cp profiles/dubu/public/jobs.json public/feeds/dubu.json
      - name: Persist refreshed feed baseline
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved during collection; skip baseline persistence"
            exit 0
          fi
          node scripts/format-feed-baseline.mjs public/jobs.json docs/jobs.json
          git add docs/jobs.json profiles/dubu/public/jobs.json
          if git diff --cached --quiet -- docs/jobs.json profiles/dubu/public/jobs.json; then
            echo "No feed baseline changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh job feed $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push origin HEAD:main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
