<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 구인 공고 모음</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">DIGITAL NOMAD JOB RADAR</p>
      <h1>내가 지원할 만한 공고만 한곳에서</h1>
      <p class="lede">여러 플랫폼의 공고를 모아 검색하고, 관심·지원 상태까지 한곳에서 관리합니다.</p>
    </div>
    <div class="actions">
      <button id="exportStateBtn" class="button secondary">상태 백업</button>
      <button id="importStateBtn" class="button secondary">상태 가져오기</button>
      <input id="importStateFile" type="file" accept="application/json,.json" hidden>
      <button id="addJobBtn" class="button secondary">공고 추가</button>
      <button id="refreshBtn" class="button primary">목록 새로고침</button>
    </div>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <section class="panel filters">
      <div class="field search-field">
        <label for="query">검색</label>
        <input id="query" type="search" placeholder="직무, 회사, 키워드 검색">
      </div>
      <div class="field">
        <label for="source">소스</label>
        <select id="source"><option value="">전체</option></select>
      </div>
      <div class="field">
        <label for="category">분야</label>
        <select id="category"><option value="">전체</option></select>
      </div>
      <div class="field">
        <label for="remote">근무 형태</label>
        <select id="remote">
          <option value="">전체</option>
          <option value="remote">원격</option>
        </select>
      </div>
      <div class="field">
        <label for="eligibility">지원 범위</label>
        <select id="eligibility">
          <option value="likely" selected>한국 / Worldwide</option>
          <option value="">전체</option>
          <option value="korea">한국에서 지원 가능</option>
          <option value="worldwide">Worldwide</option>
          <option value="restricted">특정 국가 제한</option>
          <option value="unknown">확인 필요</option>
        </select>
      </div>
      <div class="field">
        <label for="ageFilter">게시 시점</label>
        <select id="ageFilter">
          <option value="">전체</option>
          <option value="7">최근 7일</option>
          <option value="14">최근 14일</option>
          <option value="30">최근 30일</option>
        </select>
      </div>
      <div class="field">
        <label for="listingFilter">모집 상태</label>
        <select id="listingFilter">
          <option value="active" selected>현재 볼 공고</option>
          <option value="verified_open">모집 확인됨</option>
          <option value="current_feed">현재 피드</option>
          <option value="stale">오래된 공고</option>
          <option value="source_error">소스 확인 실패</option>
          <option value="archived_missing">현재 피드에서 사라짐</option>
          <option value="talent_pool">인재풀</option>
          <option value="expired">종료 확인</option>
          <option value="all">전체</option>
        </select>
      </div>
      <div class="field">
        <label for="sourceKindFilter">출처 검증</label>
        <select id="sourceKindFilter">
          <option value="">전체</option>
          <option value="official_ats">공식 직접 채용</option>
          <option value="job_board">채용 보드</option>
          <option value="aggregator">집계 피드</option>
          <option value="manual">직접 추가</option>
        </select>
      </div>
      <div class="field">
        <label for="paymentFilter">지급·후기</label>
        <select id="paymentFilter">
          <option value="">전체</option>
          <option value="exclude_caution">주의 후기 제외</option>
          <option value="caution">주의 후기 있음</option>
          <option value="not_payer">채용 보드/집계</option>
        </select>
      </div>
      <div class="field">
        <label for="minScore">최소 적합도</label>
        <select id="minScore">
          <option value="0">전체</option>
          <option value="20" selected>추천 20+</option>
          <option value="40">40+</option>
          <option value="60">60+</option>
          <option value="80">80+</option>
        </select>
      </div>
      <div class="field">
        <label for="sort">정렬</label>
        <select id="sort">
          <option value="score">적합도 높은 순</option>
          <option value="newest">최신 순</option>
          <option value="oldest">오래된 순</option>
          <option value="company">회사명</option>
          <option value="title">직무명</option>
        </select>
      </div>
      <div class="field">
        <label for="statusFilter">내 상태</label>
        <select id="statusFilter">
          <option value="active">숨김 제외</option>
          <option value="all">전체</option>
          <option value="new">새 공고</option>
          <option value="unreviewed">미검토</option>
          <option value="saved">관심 공고</option>
          <option value="planned">지원 예정</option>
          <option value="applied">지원함</option>
          <option value="hidden">숨긴 공고</option>
        </select>
      </div>
    </section>

    <section id="batchBar" class="batch-bar" hidden aria-live="polite">
      <label class="batch-select-all"><input id="selectVisible" type="checkbox"> 현재 표시 공고 선택</label>
      <strong id="selectedCount">0개 선택</strong>
      <div class="batch-actions">
        <button id="batchFavorite" class="button compact">관심</button>
        <button id="batchPlanned" class="button compact">지원 예정</button>
        <button id="batchApplied" class="button compact">지원함</button>
        <button id="batchReviewed" class="button compact">검토 완료</button>
        <button id="batchHide" class="button compact">숨기기</button>
        <button id="clearSelection" class="button compact secondary-light">선택 해제</button>
      </div>
    </section>

    <section class="result-head">
      <div>
        <strong id="resultCount">0개</strong>
        <span id="updatedAt"></span>
      </div>
      <p class="source-note">상세·원문 확인 또는 상태 변경 시 검토 완료로 기록됩니다.</p>
    </section>

    <section id="jobs" class="job-grid" aria-live="polite"></section>
    <section id="empty" class="empty" hidden>
      <p id="emptyMessage">조건에 맞는 공고가 없습니다.</p>
      <div class="empty-actions"><button id="resetFilters" class="button secondary-light">필터 초기화</button><button id="retryLoad" class="button primary">다시 불러오기</button></div>
    </section>
    <div class="load-more-wrap"><button id="loadMore" class="button secondary load-more" hidden>더 보기</button></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toastText"></span><button id="undoHide">되돌리기</button></div>

  <dialog id="addDialog">
    <form id="addForm" method="dialog">
      <div class="dialog-head"><h2>공고 직접 추가</h2><button type="button" id="closeDialog" class="icon" aria-label="공고 추가 창 닫기">×</button></div>
      <p>LinkedIn·Indeed 등에서 발견한 공고를 한곳에서 관리할 때 사용합니다.</p>
      <div class="dialog-grid">
        <label>소스<input name="source" placeholder="LinkedIn, Indeed 등"></label>
        <label>직무명 *<input name="title" required></label>
        <label>회사<input name="company"></label>
        <label>위치<input name="location"></label>
        <label class="wide">URL *<input name="url" type="url" required></label>
        <label class="wide">설명<textarea name="description" rows="5"></textarea></label>
        <label class="check wide"><input name="remote" type="checkbox"> 원격 공고</label>
      </div>
      <div class="dialog-actions"><button type="button" id="cancelDialog" class="button secondary">취소</button><button class="button primary" value="default">저장</button></div>
    </form>
  </dialog>

  <template id="jobTemplate">
    <article class="job-card">
      <div class="job-top">
        <div class="job-select-group"><input class="job-select" type="checkbox"><div><span class="source"></span><span class="score"></span></div></div>
        <div class="mini-actions"><button class="favorite" type="button" aria-label="관심 공고">☆</button><button class="dismiss" type="button" aria-label="숨기기">×</button></div>
      </div>
      <div class="quality-badges"><span class="listing-badge"></span><span class="trust-badge"></span><span class="payment-badge"></span></div>
      <h2 class="title"></h2>
      <p class="company"></p>
      <div class="meta"></div>
      <p class="description"></p>
      <div class="tags"></div>
      <div class="workflow-row">
        <select class="job-state" aria-label="지원 상태">
          <option value="">상태 없음</option>
          <option value="planned">지원 예정</option>
          <option value="applied">지원함</option>
        </select>
      </div>
      <div class="card-footer"><span class="posted"></span><button class="details">상세 보기</button><a class="apply" target="_blank" rel="noopener noreferrer">원문 ↗</a></div>
    </article>
  </template>

  <dialog id="detailsDialog" class="details-dialog">
    <div class="dialog-head"><h2 id="detailsTitle"></h2><button type="button" id="closeDetails" class="icon" aria-label="공고 상세 창 닫기">×</button></div>
    <p id="detailsCompany" class="details-company"></p>
    <div id="detailsMeta" class="meta"></div>
    <section class="trust-panel" aria-labelledby="trustHeading">
      <h3 id="trustHeading">공고 확인 정보</h3>
      <div id="detailsTrust" class="quality-badges"></div>
      <p id="detailsSourceSummary"></p>
      <div id="detailsEvidence" class="evidence-links"></div>
      <p id="detailsVerifiedAt" class="verified-at"></p>
    </section>
    <div id="detailsDescription" class="details-description"></div>
    <div class="dialog-actions details-actions"><button id="prevDetails" class="button secondary-light" type="button">← 이전</button><button id="nextDetails" class="button secondary-light" type="button">다음 →</button><a id="detailsLink" class="button primary" target="_blank" rel="noopener noreferrer">원문 공고 보기 ↗</a></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
